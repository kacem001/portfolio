<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyberVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="hoodInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Cyber Tech Grid & Circular Data Rings -->
  <g opacity="0.25">
    <circle cx="200" cy="200" r="170" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,8" />
    <circle cx="200" cy="200" r="145" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="12,6,4,6" />
    <circle cx="200" cy="200" r="120" fill="none" stroke="#8b5cf6" stroke-width="0.8" />
    <line x1="30" y1="200" x2="370" y2="200" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="4,6" />
    <line x1="200" y1="30" x2="200" y2="370" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="4,6" />
  </g>

  <!-- AI / Code Nodes in Background -->
  <g opacity="0.4">
    <circle cx="95" cy="110" r="3" fill="#06b6d4" />
    <circle cx="305" cy="110" r="3" fill="#6366f1" />
    <circle cx="70" cy="240" r="2.5" fill="#ec4899" />
    <circle cx="330" cy="240" r="2.5" fill="#06b6d4" />
    <path d="M 95 110 L 130 145 M 305 110 L 270 145" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Anonymous Developer Silhouette -->
  <!-- Shoulders & Torso / Hoodie Outer -->
  <path d="M 90 380 C 90 305, 130 260, 200 260 C 270 260, 310 305, 310 380 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Hoodie Rim / Shoulder Accent Glow -->
  <path d="M 95 375 C 105 315, 140 275, 200 275 C 260 275, 295 315, 305 375" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.5" />

  <!-- Hoodie Head Outer Shape -->
  <path d="M 125 195 C 120 100, 150 70, 200 70 C 250 70, 280 100, 275 195 C 270 245, 245 265, 200 265 C 155 265, 130 245, 125 195 Z" fill="url(#hoodieGrad)" stroke="#475569" stroke-width="1.5" />

  <!-- Inner Hood Void / Dark Face Pocket -->
  <path d="M 142 190 C 138 120, 160 95, 200 95 C 240 95, 262 120, 258 190 C 255 235, 235 248, 200 248 C 165 248, 145 235, 142 190 Z" fill="url(#hoodInner)" />

  <!-- Subtle Face Silhouette Depth -->
  <ellipse cx="200" cy="180" rx="38" ry="46" fill="#0c1322" opacity="0.8" />

  <!-- Futuristic Glowing Cyber Visor / Digital Mask -->
  <g filter="url(#glow)">
    <path d="M 160 172 Q 200 166 240 172 Q 242 182 238 184 Q 200 179 162 184 Q 158 182 160 172 Z" fill="url(#cyberVisor)" />
    <!-- Center HUD beam indicator -->
    <line x1="175" y1="177" x2="225" y2="177" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  </g>

  <!-- Digital Circuit Lines running from Collar -->
  <g opacity="0.7">
    <path d="M 200 275 L 200 345 M 175 295 L 175 355 M 225 295 L 225 355" stroke="url(#neonGlow)" stroke-width="1.5" stroke-dasharray="8,4" />
    <circle cx="200" cy="350" r="3" fill="#06b6d4" />
    <circle cx="175" cy="360" r="2.5" fill="#6366f1" />
    <circle cx="225" cy="360" r="2.5" fill="#8b5cf6" />
  </g>

  <!-- Binary / Tech Watermark Code -->
  <text x="200" y="385" font-family="Courier New, monospace" font-size="9" fill="#06b6d4" text-anchor="middle" letter-spacing="3" opacity="0.6">
    AI ENGINEER // ANONYMOUS
  </text>
</svg>
